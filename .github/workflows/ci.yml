name: CI

on:
  push:
    branches: [main, template]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-public-tree.mjs
      - run: node scripts/check-workflows.mjs
      - name: Validate local collector configuration
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            -v "$PWD/deploy/otel.yaml:/etc/otel.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.160.0 validate \
            --config=/etc/otel.yaml
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Build both container targets
        run: docker compose build web worker
