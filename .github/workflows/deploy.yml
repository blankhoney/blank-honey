name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Request the fixed server deployment command
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing deployment host}"
          : "${DEPLOY_USER:?Missing deployment user}"
          : "${DEPLOY_SSH_KEY:?Missing restricted SSH key}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing verified host key}"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          umask 077
          deploy_directory=$(mktemp -d)
          trap 'rm -rf "$deploy_directory"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$deploy_directory/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_directory/known_hosts"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_directory/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$deploy_directory/key" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $COMMIT"
