<svg xmlns="http://www.w3.org/2000/svg" width="480" height="580" viewBox="0 0 480 580" role="img" aria-labelledby="title desc"><title id="title">同步双轨共享检索后等待汇合</title><desc id="desc">输入与会话经一次改写和检索后分到A线和B线。A生成完成仍等待B，最后一起返回。图形长短不代表实测时间。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#54716b"/></marker></defs><rect width="480" height="580" rx="18" fill="#f5f5ef"/><g font-family="PingFang SC,Heiti SC,sans-serif" fill="#243b35" text-anchor="middle"><text x="240" y="38" font-size="24">/v1/dual：等两条线完成</text><rect x="85" y="65" width="310" height="58" rx="12" fill="#fff" stroke="#a9bdb3"/><text x="240.0" y="94" font-size="20">用户输入 + 最近会话</text><path d="M240 123V147" fill="none" stroke="#54716b" stroke-width="2" marker-end="url(#arr)"/><rect x="85" y="153" width="310" height="86" rx="12" fill="#fff" stroke="#a9bdb3"/><text x="240.0" y="182" font-size="20">改写 query</text><text x="240.0" y="211" font-size="20">检索 → recall_bundle</text><path d="M240 239V260H125V282" fill="none" stroke="#54716b" stroke-width="2" marker-end="url(#arr)"/><path d="M240 260H355V282" fill="none" stroke="#54716b" stroke-width="2" marker-end="url(#arr)"/><rect x="30" y="290" width="190" height="85" rx="12" fill="#fff" stroke="#a9bdb3"/><text x="125.0" y="319" font-size="20">A 线短回复</text><text x="125.0" y="348" font-size="20">生成完成</text><rect x="260" y="290" width="190" height="116" rx="12" fill="#fff" stroke="#a9bdb3"/><text x="355.0" y="319" font-size="20">B 线报告</text><text x="355.0" y="348" font-size="20">生成中</text><text x="355.0" y="377" font-size="20">随后完成</text><path d="M125 375V437H240V460" fill="none" stroke="#54716b" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 4"/><path d="M355 406V437H240" fill="none" stroke="#54716b" stroke-width="2" marker-end="url(#arr)"/><rect x="85" y="469" width="310" height="85" rx="12" fill="#fff" stroke="#a9bdb3"/><text x="240.0" y="498" font-size="20">汇合后一起返回</text><text x="240.0" y="527" font-size="20">A 完成时仍可能在等 B</text></g></svg>