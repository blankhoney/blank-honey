<svg xmlns="http://www.w3.org/2000/svg" width="480" height="590" viewBox="0 0 480 590" role="img" aria-labelledby="title desc"><title id="title">报告异步任务与版本关系</title><desc id="desc">A线聊天持续收集会话信息。条件触发或手动请求创建报告任务，后台生成与报告版本分开记录。完成后保存报告版本供右侧展示。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#54716b"/></marker></defs><rect width="480" height="590" rx="18" fill="#f5f5ef"/><g font-family="PingFang SC,Heiti SC,sans-serif" fill="#243b35" text-anchor="middle"><text x="240" y="38" font-size="24">v1.2：报告任务与结果版本</text><rect x="50" y="65" width="380" height="85" rx="12" fill="#fff" stroke="#a9bdb3"/><text x="240.0" y="94" font-size="20">用户继续输入</text><text x="240.0" y="123" font-size="20">A 线逐段回复</text><path d="M240 150V178" fill="none" stroke="#54716b" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="186" width="380" height="58" rx="12" fill="#fff" stroke="#a9bdb3"/><text x="240.0" y="215" font-size="20">SessionIntake：收集会话信息</text><text x="240" y="279" font-size="19">达到触发条件或手动请求</text><path d="M240 290V310" fill="none" stroke="#54716b" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="318" width="380" height="85" rx="12" fill="#fff" stroke="#a9bdb3"/><text x="240.0" y="347" font-size="20">schedule 发起 ReportJob</text><text x="240.0" y="376" font-size="20">报告在后台生成</text><text x="240" y="436" font-size="19">查看任务状态，读取完成结果</text><path d="M240 447V468" fill="none" stroke="#54716b" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="476" width="380" height="85" rx="12" fill="#fff" stroke="#a9bdb3"/><text x="240.0" y="505" font-size="20">完成后保存 ReportVersion</text><text x="240.0" y="534" font-size="20">右侧读取并展示报告版本</text></g></svg>