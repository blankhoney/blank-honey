<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>JSON Workbench</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f4f0e7;
      color: #302e29;
      font:
        16px/1.7 system-ui,
        sans-serif;
    }
    main {
      width: min(760px, calc(100% - 40px));
      margin: 8vh auto;
    }
    a {
      color: inherit;
    }
    h1 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: clamp(32px, 6vw, 56px);
    }
    p {
      color: #686356;
    }
    textarea {
      display: block;
      width: 100%;
      min-height: 280px;
      padding: 18px;
      background: #fffcf5;
      border: 1px solid #b8af9d;
      border-radius: 4px;
      font: 14px/1.6 monospace;
      resize: vertical;
    }
    button,
    input {
      font: inherit;
      padding: 9px 16px;
      border: 1px solid #928878;
      border-radius: 4px;
      background: transparent;
      color: inherit;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #e8e0d1;
    }
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #81744d;
      outline-offset: 3px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0;
    }
    output {
      display: block;
      white-space: pre-wrap;
    }
    footer {
      margin-top: 48px;
      font-size: 13px;
      color: #686356;
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <main>
    <a href="__SITE_RETURN__" target="_top">← 返回主站</a>
    <h1>JSON Workbench</h1>
    <p>格式化、压缩，或检查 JSON。保留原始输入，结果显示在下方。</p>
    <label for="input">输入 JSON</label
    ><textarea id="input" spellcheck="false" placeholder='{"hello": "world"}'></textarea>
    <div class="actions">
      <button data-space="2">格式化</button><button data-space="0">压缩</button
      ><button id="copy">复制结果</button>
    </div>
    <label for="result">结果</label><textarea id="result" readonly></textarea
    ><output id="status" role="status"></output>
    <footer>内容仅在当前浏览器处理，不上传、不保存。</footer>
  </main>
  <script>
    const input = document.querySelector('#input'),
      result = document.querySelector('#result'),
      status = document.querySelector('#status');
    document.querySelectorAll('[data-space]').forEach(
      (button) =>
        (button.onclick = () => {
          try {
            result.value = JSON.stringify(
              JSON.parse(input.value),
              null,
              Number(button.dataset.space),
            );
            status.textContent = '有效 JSON';
          } catch (error) {
            status.textContent = error.message;
          }
        }),
    );
    document.querySelector('#copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(result.value);
        status.textContent = '已复制';
      } catch {
        result.focus();
        result.select();
        status.textContent = '请使用系统复制快捷键';
      }
    };
  </script>
</html>
