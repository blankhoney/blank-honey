<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A real-time Schwarzschild black-hole simulation with general-relativistic null-geodesic ray tracing."
    />
    <title>Schwarzschild — Black Hole Ray Tracer</title>
    <script type="module" crossorigin src="./assets/index-eGcHBHBs.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-ZPSNizk-.css">
  </head>
  <body>
    <main id="app" aria-label="Schwarzschild 黑洞广义相对论光线追踪模拟"></main>

    <header class="hud hud--title">
      <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span>LIVE · NULL GEODESICS</p>
      <h1>Schwarzschild</h1>
      <p class="subtitle">广义相对论黑洞光线追踪</p>
    </header>

    <aside class="hud hud--science" aria-label="物理模型">
      <dl>
        <div><dt>度规</dt><dd>Schwarzschild</dd></div>
        <div><dt>事件视界</dt><dd>r = 2M</dd></div>
        <div><dt>光子球</dt><dd>r = 3M</dd></div>
        <div><dt>吸积盘内缘</dt><dd>ISCO = 6M</dd></div>
        <div><dt>观测距离</dt><dd id="observer-distance">—</dd></div>
      </dl>
      <details>
        <summary>实时求解的方程</summary>
        <p>d²u/dφ² + u = 3Mu²，u = 1/r</p>
        <p>每像素自适应步长 RK4；盘面辐射包含 Novikov–Thorne 通量、引力红移与相对论多普勒增亮。</p>
      </details>
    </aside>

    <nav class="controls" aria-label="模拟控制">
      <button id="orbit-toggle" type="button" aria-pressed="true">暂停自动环绕</button>
      <button id="reset-view" type="button">重置视角</button>
    </nav>

    <p class="hint"><span>拖动</span> 旋转视角 <i></i><span>滚轮 / 双指</span> 缩放</p>
    <p id="status" class="status" role="status">正在初始化 WebGL2 光线追踪器…</p>

    <noscript>此模拟需要启用 JavaScript。</noscript>
  </body>
</html>
