<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a33a27" />
    <meta
      name="description"
      content="可自由环游的 Three.js 体素中国古典建筑群：山门、庭院、主殿、配殿、钟鼓楼与宝塔。"
    />
    <title>紫宸宫阙 · 体素建筑群</title>
    <script type="module" crossorigin src="./assets/index-BAezx9vJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DZrm7hs6.css">
  </head>
  <body>
    <main id="app" aria-label="紫宸宫阙三维体素建筑群">
      <canvas id="scene" aria-label="可旋转浏览的中国古典建筑群三维场景"></canvas>

      <header class="masthead">
        <p class="eyebrow">VOXEL ARCHITECTURE · THREE.JS</p>
        <h1>紫宸宫阙</h1>
        <p class="subtitle">沿御道穿过山门，在晨光中游览一座由体素搭建的中轴宫苑。</p>
      </header>

      <aside class="scene-key" aria-label="场景建筑说明">
        <span><i class="dot dot-gold"></i>中轴</span>
        <span>山门</span>
        <span>钟鼓楼</span>
        <span>东西配殿</span>
        <span>紫宸殿</span>
        <span>五层宝塔</span>
      </aside>

      <div class="controls-hint">
        <button id="tourToggle" type="button" aria-label="暂停自动巡游" aria-pressed="true">
          <span class="pause-icon" aria-hidden="true"></span>
          <span class="button-label">自动巡游</span>
        </button>
        <p>拖拽环游 <b>·</b> 滚轮缩放</p>
      </div>

      <div class="orientation" aria-hidden="true">
        <span>北</span>
        <i></i>
      </div>

      <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="seal">宫</div>
        <p>正在搭建体素宫阙</p>
        <span></span>
      </div>

      <noscript>请启用 JavaScript 以观看三维场景。</noscript>
    </main>
  </body>
</html>
