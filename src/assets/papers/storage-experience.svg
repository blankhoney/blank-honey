<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">日志如何被保存、反思和归纳</title><desc id="desc">同一批任务记录可以保存原始轨迹，整理单次失败，或从多次记录归纳带条件的办法。三者可以并存。</desc>
<rect width="960" height="460" fill="#faf6ee"/>
<g font-family="sans-serif" fill="#342f28"><text x="40" y="48" font-size="25">同一批记录，不同程度的加工</text>
<g fill="#ece3d4" stroke="#baaa91"><rect x="40" y="82" width="880" height="64" rx="5"/><rect x="40" y="198" width="270" height="202" rx="5"/><rect x="345" y="198" width="270" height="202" rx="5"/><rect x="650" y="198" width="270" height="202" rx="5"/></g>
<text x="65" y="122" font-size="21">任务甲、乙、丙：输入、动作、工具反馈与修正</text>
<path d="M480 146v26H175v26M480 172v26M480 172h305v26" fill="none" stroke="#8a7255" stroke-width="2"/>
<text x="62" y="238" font-size="22">保存 Storage</text><text x="62" y="282" font-size="18">原始轨迹仍可回查</text><text x="62" y="320" font-size="18">哪份文件？哪次返回？</text><text x="62" y="365" font-size="17" fill="#706256">保留细节，也保留噪声</text>
<text x="367" y="238" font-size="22">反思 Reflection</text><text x="367" y="282" font-size="18">整理一次失败的原因</text><text x="367" y="320" font-size="18">这份文件该怎样修？</text><text x="367" y="365" font-size="17" fill="#706256">修法仍有适用范围</text>
<text x="672" y="238" font-size="22">经验 Experience</text><text x="672" y="282" font-size="18">对照多次记录找规律</text><text x="672" y="320" font-size="18">新文件先确认什么？</text><text x="672" y="365" font-size="17" fill="#706256">保留条件、反例和停点</text>
<text x="40" y="438" font-size="16" fill="#706256">依据 From Storage to Experience v1 的分类整理；示意图，非原论文图。三种处理可以并存。</text></g></svg>