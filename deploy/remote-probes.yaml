# Merged with the existing private collector config, preserving the local receiver.
receivers:
  prometheus/remote:
    config:
      scrape_configs:
        - &remote_job
          job_name: node
          scrape_interval: 5s
          scrape_timeout: 4s
          scheme: https
          tls_config:
            ca_file: /etc/probe-certificates.pem
            min_version: TLS12
          file_sd_configs:
            - files: ['/etc/remote-hosts.json']
              refresh_interval: 30s
          relabel_configs:
            - source_labels: [publicId]
              regex: malaysia
              action: keep
        # The SSH forward preserves the USA exporter's TLS identity end to end.
        - <<: *remote_job
          job_name: node-west-us
          tls_config:
            ca_file: /etc/probe-certificates.pem
            server_name: 12.19.136.115
            min_version: TLS12
          relabel_configs:
            - source_labels: [publicId]
              regex: west-us
              action: keep
            - target_label: job
              replacement: node
        # The existing HTTPS gateway has a public certificate, verified by system roots.
        - <<: *remote_job
          job_name: node-tencent
          metrics_path: /blank-honey-metrics
          tls_config:
            min_version: TLS12
          relabel_configs:
            - source_labels: [publicId]
              regex: tencent
              action: keep
            - target_label: job
              replacement: node
service:
  pipelines:
    metrics:
      receivers: [prometheus, prometheus/remote]
